<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>センターフライ</title>
<meta name="theme-color" content="#0a0d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">
  <div class="phone"></div>
  <p>スマホを横向きにしてください</p>
  <small>センターフライは横画面で遊ぶゲームです</small>
</div>
<div id="wrap">
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="game" width="960" height="640"></canvas>
    <div id="share" hidden>
      <button id="shareBtn" class="sbtn main" type="button">📤 結果をシェア<small id="shareMsg">成績画像つきでシェアできます</small></button>
      <div class="row">
        <a id="shareX" class="sbtn" target="_blank" rel="noopener">𝕏 ポスト</a>
        <a id="shareLine" class="sbtn" target="_blank" rel="noopener">LINE</a>
        <button id="shareCopy" class="sbtn" type="button">コピー</button>
      </div>
    </div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="sound.js"></script>
<script src="scene3d.js"></script>
<script src="game.js"></script>
</body>
</html>
